<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tomorrow’s Date 💖 Food Preferences</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root{--red:#ff4d6d;--pink:#ffb3c6;--light:#ffffff;}
    *{box-sizing:border-box;}
    body{margin:0;background:linear-gradient(135deg,#fff 60%,#ffe3ec 100%);font-family:'Press Start 2P',monospace;color:#333;}
    .wrap{max-width:760px;margin:24px auto 48px;padding:16px;}
    .card{background:var(--light);border:4px solid var(--red);box-shadow:8px 8px 0 var(--pink);padding:20px;}
    h1,h2{color:var(--red);} h1{font-size:18px;text-align:center;} h2{font-size:14px;margin-top:24px;}
    p{font-size:11px;line-height:1.6;}
    .cat{width:8px;height:8px;margin:0 auto 10px;box-shadow:16px 0 var(--red),24px 0 var(--red),32px 0 var(--red),8px 8 var(--red),16px 8 var(--light),24px 8 var(--light),32px 8 var(--light),40px 8 var(--red),0 16px var(--red),8px 16px var(--light),16px 16px var(--light),24px 16px var(--light),32px 16px var(--light),40px 16px var(--light),48px 16px var(--red),8px 24px var(--red),16px 24px #000,24px 24 var(--light),32px 24 #000,40px 24 var(--red),16px 32px var(--red),24px 32px var(--red),32px 32px var(--red);}
    .group{display:grid;grid-template-columns: repeat(auto-fit, minmax(200px,1fr));gap:12px;margin-top:12px;}
    label{display:flex;align-items:center;gap:8px;border:3px solid #eee;padding:10px;cursor:pointer;background:#fff;}
    input[type=checkbox]{transform: scale(1.2);accent-color: var(--red);}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;}
    button{font-family:'Press Start 2P',monospace;font-size:11px;padding:10px 12px;border:4px solid var(--red);background:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--pink);}
    #reaction{min-height:20px;text-align:center;color:#ff4d6d;font-size:10px;}
    #finalMsg,#goodJob,#summary{display:none;text-align:center;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <h1>💖 For Our Date Tomorrow 💖</h1>
    <div class="cat" aria-hidden="true"></div>
    <p id="instructions">Hi love 💕 Help me choose what you feel like eating tomorrow. Just pick everything you like ✨</p>
    <div id="reaction"></div>

    <h2>Food Preferences</h2>
    <div class="group">
      <label><input type="checkbox" value="Filipino"/> Filipino</label>
      <label><input type="checkbox" value="Japanese"/> Japanese</label>
      <label><input type="checkbox" value="Korean"/> Korean</label>
      <label><input type="checkbox" value="Italian"/> Italian</label>
      <label><input type="checkbox" value="Chinese"/> Chinese</label>
      <label><input type="checkbox" value="Thai"/> Thai</label>
      <label><input type="checkbox" value="Fast Food"/> Fast Food</label>
      <label><input type="checkbox" value="Cafe / Coffee"/> Cafe / Coffee</label>
      <label><input type="checkbox" value="Ramen"/> Ramen</label>
      <label><input type="checkbox" value="Samgyupsal / BBQ"/> Samgyupsal / BBQ</label>
      <label><input type="checkbox" value="Seafood"/> Seafood</label>
      <label><input type="checkbox" value="Steak"/> Steak</label>
      <label><input type="checkbox" value="Hotpot"/> Hotpot</label>
      <label><input type="checkbox" value="Buffet"/> Buffet</label>
    </div>

    <div class="actions" id="actions">
      <button onclick="finish()">Finish Picking 💖</button>
    </div>
    <div class="actions" id="confirmActions" style="display:none;">
      <button onclick="confirmFinal(true)">Yes, final na 💖</button>
      <button onclick="confirmFinal(false)">Change choices</button>
    </div>

    <h2 id="goodJob" style="color:#ff4d6d;">gud job 😌</h2>
    <h2 id="finalMsg" style="color:#ff4d6d;">Thank you 💖<br><br>I’ll find the best restaurant we could eat.<br>Ako na po bahala 😌</h2>
    <textarea id="summary" readonly style="margin-top:16px; display:none;"></textarea>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function(){

    // Initialize EmailJS with your User ID
    emailjs.init('e22kQ42fseQ3Apb5W');

    const clickSound = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    const reactions = ['Sarapp 🤤','Gud choice 😌','Sure, po? 🥺','Yummyy 😋','Galing naman pumili love 💖'];
    const reactionBox = document.getElementById('reaction');

    function playFeedback(){
      reactionBox.textContent = reactions[Math.floor(Math.random()*reactions.length)];
      clickSound.currentTime = 0;
      clickSound.play().catch(()=>{});
    }

    document.querySelectorAll('input[type=checkbox]').forEach(el => {
      el.addEventListener('click', playFeedback);
    });

    // Make these functions global so buttons can call them
    window.finish = function(){
      const picks = [...document.querySelectorAll('input[type=checkbox]:checked')];
      if(picks.length === 0){ alert('Pick at least one, love 💕'); return; }
      document.getElementById('actions').style.display='none';
      document.getElementById('confirmActions').style.display='flex';
      reactionBox.textContent = 'Is this final, love? 💖';
    }

    window.confirmFinal = function(isFinal){
      if(!isFinal){
        document.getElementById('confirmActions').style.display='none';
        document.getElementById('actions').style.display='flex';
        reactionBox.textContent = 'Okay, change lang 😌';
        return;
      }

      const values = [...document.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value);
      document.getElementById('instructions').style.display='none';
      document.querySelector('.group').style.display='none';
      document.getElementById('confirmActions').style.display='none';
      reactionBox.style.display='none';

      const box = document.getElementById('summary');
      box.value = `Her food choices:\n- ${values.join('\n- ')}`;
      box.style.display='block';

      document.getElementById('goodJob').style.display='block';
      clickSound.currentTime=0; clickSound.play().catch(()=>{});

      // Send choices via EmailJS with your Service ID and Template ID
      emailjs.send('service_tqzpaeo','template_ojr1iu9',{
        choices: values.join(', '),
        timestamp: new Date().toLocaleString()
      }).then(()=>{
        console.log('Email sent successfully!');
      }).catch(err=>{
        console.error('EmailJS error:', err);
      });

      setTimeout(()=>{
        document.getElementById('goodJob').style.display='none';
        box.style.display='none';
        document.getElementById('finalMsg').style.display='block';
      },1200);
    }

  });
</script>
</body>
</html>
